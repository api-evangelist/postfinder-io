aid: postfinder-io
name: Postfinder
image: https://postfinder.io/og.png
description: Postfinder provides an API for Australian address autocomplete and location lookup of post offices, parcel lockers, carrier drop‑off
  points and street post boxes. The service aggregates data from Australia Post, OpenStreetMap and carrier feeds, offering opening hours, addresses,
  maps and postcode lookup. Users can search by suburb, street address or postcode, and also browse locations by state or country, covering Australia,
  Canada, New Zealand, the United Kingdom and the United States. The API returns structured JSON suitable for integration into e‑commerce, logistics
  and mapping applications.
